<text x="44" y="554" fill="#5f6d75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Audit testers require their own log event before each service; the new tester is initialized unlogged.</text>
<text x="44" y="582" fill="#5f6d75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">The availability and no-audit-gap clauses form one interval tester. There is no added precedence edge.</text>
<text x="44" y="610" fill="#5f6d75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Measured certificate path; event order only. This candidate does not demonstrate boundary-granularity loss.</text>
